name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build --config Release --target discord_presence --parallel

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/Release/discord_presence.exe dist/
          if (Test-Path config.json) {
              Copy-Item config.json dist/
          } else {
              '{"app_id": "", "bot_token": "", "update_ms": 5000}' | Out-File -FilePath dist/config.json -Encoding utf8
          }
          New-Item -ItemType Directory -Force -Path dist/icons

      - uses: actions/upload-artifact@v4
        with:
          name: discord-presence-win-x64
          path: dist/
